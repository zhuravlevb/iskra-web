name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - run: pnpm e2e
        env:
          PW_ENGINES: ${{ matrix.engine }}
      # Артефакты из CI достать не всегда можно — снимок страницы на момент падения
      # (дерево доступности) печатается прямо в лог.
      - name: Снимки упавших тестов
        if: failure()
        run: |
          for f in test-results/*/error-context.md; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            sed -n '/^# Page snapshot/,$p' "$f" | head -150
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-${{ matrix.engine }}
          path: test-results/
